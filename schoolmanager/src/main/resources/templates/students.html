<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Manager</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #334155
                );

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;

            overflow-x:hidden;
        }

        .container{

            width:100%;

            max-width:1200px;

            background:
                rgba(255,255,255,0.08);

            backdrop-filter:blur(18px);

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius:30px;

            padding:40px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.4);

            animation:fadeIn 0.7s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;

            flex-wrap:wrap;

            gap:20px;
        }

        .header h1{

            color:white;

            font-size:38px;

            font-weight:700;
        }

        .header p{

            color:#cbd5e1;

            margin-top:5px;
        }

        .form-section{

            display:grid;

            grid-template-columns:
                repeat(auto-fit,minmax(250px,1fr));

            gap:15px;

            margin-bottom:20px;
        }

        input{

            width:100%;

            padding:15px;

            border:none;

            outline:none;

            border-radius:15px;

            background:
                rgba(255,255,255,0.08);

            color:white;

            font-size:14px;

            transition:0.3s;
        }

        input::placeholder{
            color:#cbd5e1;
        }

        input:focus{

            background:
                rgba(255,255,255,0.15);

            box-shadow:
                0 0 0 3px rgba(59,130,246,0.4);

        }

        .button-group{

            display:flex;

            gap:15px;

            margin-top:10px;

            margin-bottom:20px;

            flex-wrap:wrap;
        }

        button{

            border:none;

            padding:14px 22px;

            border-radius:14px;

            cursor:pointer;

            font-weight:600;

            transition:0.3s;

            font-size:14px;
        }

        button:hover{

            transform:translateY(-2px);

            opacity:0.9;
        }

        .btn-save{

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            color:white;
        }

        .btn-edit{

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );

            color:white;
        }

        .btn-delete{

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            color:white;
        }

        .btn-cancel{

            background:
                linear-gradient(
                    135deg,
                    #64748b,
                    #475569
                );

            color:white;
        }

        .search-box{

            margin-bottom:20px;
        }

        .message{

            margin-bottom:15px;

            font-weight:600;

            font-size:14px;
        }

        .success{
            color:#4ade80;
        }

        .error{
            color:#f87171;
        }

        table{

            width:100%;

            border-collapse:collapse;

            overflow:hidden;

            border-radius:20px;

            background:
                rgba(255,255,255,0.05);

            backdrop-filter:blur(10px);
        }

        table th{

            background:
                rgba(255,255,255,0.08);

            padding:18px;

            color:white;

            font-size:15px;
        }

        table td{

            padding:18px;

            text-align:center;

            color:#e2e8f0;

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        table tr{

            transition:0.3s;
        }

        table tr:hover{

            background:
                rgba(255,255,255,0.08);
        }

        .action-buttons{

            display:flex;

            justify-content:center;

            gap:10px;
        }

        .pagination{

            margin-top:25px;

            display:flex;

            justify-content:center;

            gap:10px;

            flex-wrap:wrap;
        }

        .pagination button{

            width:42px;

            height:42px;

            border:none;

            border-radius:12px;

            background:
                rgba(255,255,255,0.08);

            color:white;

            cursor:pointer;

            transition:0.3s;

            font-weight:600;
        }

        .pagination button:hover{

            background:#3b82f6;
        }

        .pagination button.active{

            background:#2563eb;

            box-shadow:
                0 0 10px rgba(37,99,235,0.5);
        }

        @media(max-width:768px){

            .header{
                flex-direction:column;
                align-items:flex-start;
            }

            table{
                font-size:13px;
            }

            .action-buttons{
                flex-direction:column;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div>

            <h1>🎓 Student Manager</h1>

            <p>Modern Student Management Dashboard</p>

        </div>

    </div>

    <input type="hidden"
           id="studentId">

    <div class="form-section">

        <input type="text"
               id="name"
               placeholder="Enter student name">

        <input type="email"
               id="email"
               placeholder="Enter student email">

    </div>

    <div class="button-group">

        <button class="btn-save"
                onclick="saveStudent()">
            Save Student
        </button>

        <button class="btn-cancel"
                onclick="resetForm()">
            Cancel
        </button>

    </div>

    <div class="search-box">

        <input type="text"
               id="search"
               placeholder="Search student..."
               onkeyup="searchStudent()">

    </div>

    <div id="message"
         class="message"></div>

    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Email</th>

            <th width="220">
                Actions
            </th>

        </tr>

        </thead>

        <tbody id="studentTable">

        <tr th:each="s : ${students}">

            <td th:text="${s.id}"></td>

            <td th:text="${s.name}"></td>

            <td th:text="${s.email}"></td>

            <td>

                <div class="action-buttons">

                    <button class="btn-edit"
                            th:attr="onclick=|editStudent('${s.id}','${s.name}','${s.email}')|">

                        Edit

                    </button>

                    <button class="btn-delete"
                            th:attr="onclick=|deleteStudent('${s.id}')|">

                        Delete

                    </button>

                </div>

            </td>

        </tr>

        </tbody>

    </table>

    <div class="pagination"
         id="pagination"></div>

</div>

<script>

    function showMessage(text,type){

        let message =
            document.getElementById("message")

        message.innerText = text

        message.className =
            "message " + type

        setTimeout(()=>{

            message.innerText = ""

        },3000)

    }

    async function saveStudent(){

        let id =
            document.getElementById("studentId")
            .value

        let name =
            document.getElementById("name")
            .value
            .trim()

        let email =
            document.getElementById("email")
            .value
            .trim()

        if(name === "" || email === ""){

            showMessage(
                "Please enter full information",
                "error"
            )

            return
        }

        let url = "/api/students"

        let method = "POST"

        if(id){

            url += "/" + id

            method = "PUT"
        }

        try{

            let response =
                await fetch(url,{

                    method:method,

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        name:name,
                        email:email

                    })

                })

            if(!response.ok){
                throw new Error()
            }

            showMessage(

                id
                ? "Student updated successfully"
                : "Student added successfully",

                "success"

            )

            setTimeout(()=>{

                location.reload()

            },1000)

        }catch(error){

            showMessage(
                "Server error",
                "error"
            )

        }

    }

    function editStudent(id,name,email){

        document.getElementById("studentId").value = id

        document.getElementById("name").value = name

        document.getElementById("email").value = email

        window.scrollTo({

            top:0,

            behavior:"smooth"

        })

    }

    async function deleteStudent(id){

        let confirmDelete =
            confirm("Delete this student?")

        if(!confirmDelete){
            return
        }

        try{

            let response =
                await fetch("/api/students/" + id,{

                    method:"DELETE"

                })

            if(!response.ok){
                throw new Error()
            }

            showMessage(
                "Deleted successfully",
                "success"
            )

            setTimeout(()=>{

                location.reload()

            },1000)

        }catch(error){

            showMessage(
                "Delete failed",
                "error"
            )

        }

    }

    function resetForm(){

        document.getElementById("studentId").value = ""

        document.getElementById("name").value = ""

        document.getElementById("email").value = ""

    }

    function searchStudent(){

        let keyword =
            document.getElementById("search")
            .value
            .toLowerCase()

        let rows =
            document.querySelectorAll(
                "#studentTable tr"
            )

        rows.forEach(row=>{

            let name =
                row.children[1]
                .innerText
                .toLowerCase()

            if(name.includes(keyword)){

                row.style.display = ""

            }else{

                row.style.display = "none"

            }

        })

    }

    const rowsPerPage = 5

    const rows =
        Array.from(
            document.querySelectorAll(
                "#studentTable tr"
            )
        )

    const pagination =
        document.getElementById("pagination")

    let currentPage = 1

    function displayTable(page){

        currentPage = page

        let start =
            (page - 1) * rowsPerPage

        let end =
            start + rowsPerPage

        rows.forEach((row,index)=>{

            if(index >= start && index < end){

                row.style.display = ""

            }else{

                row.style.display = "none"

            }

        })

        updatePaginationButtons()

    }

    function setupPagination(){

        let pageCount =
            Math.ceil(
                rows.length / rowsPerPage
            )

        pagination.innerHTML = ""

        for(let i = 1; i <= pageCount; i++){

            let btn =
                document.createElement("button")

            btn.innerText = i

            btn.addEventListener("click",()=>{

                displayTable(i)

            })

            pagination.appendChild(btn)

        }

        updatePaginationButtons()

    }

    function updatePaginationButtons(){

        let buttons =
            pagination.querySelectorAll("button")

        buttons.forEach((btn,index)=>{

            btn.classList.remove("active")

            if(index + 1 === currentPage){

                btn.classList.add("active")

            }

        })

    }

    setupPagination()

    displayTable(1)

</script>

</body>

</html>
