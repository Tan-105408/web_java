<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản Lý Sinh Viên</title>

    <!-- GOOGLE FONT -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #1e293b
                );

            min-height:100vh;

            padding:35px;

            color:white;
        }

        .container{

            display:grid;

            grid-template-columns:
                3fr 7fr;

            gap:30px;

            align-items:start;
        }

        /* LEFT */

        .left-panel{

            position:sticky;

            top:20px;
        }

        .form-card{

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(18px);

            border-radius:30px;

            padding:35px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.35);
        }

        .avatar{

            width:110px;

            height:110px;

            border-radius:50%;

            margin:auto;

            margin-bottom:25px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:40px;

            font-weight:700;

            box-shadow:
                0 10px 30px rgba(99,102,241,0.4);
        }

        .form-header{

            text-align:center;

            margin-bottom:35px;
        }

        .form-header h2{

            font-size:30px;

            margin-bottom:10px;
        }

        .form-header p{

            color:#94a3b8;
        }

        .input-group{

            margin-bottom:22px;
        }

        .input-group label{

            display:block;

            margin-bottom:10px;

            color:#cbd5e1;

            font-size:14px;
        }

        .input-box{

            position:relative;
        }

        .input-box i{

            position:absolute;

            left:18px;

            top:50%;

            transform:translateY(-50%);

            color:#94a3b8;
        }

        input{

            width:100%;

            border:none;

            outline:none;

            border-radius:18px;

            background:
                rgba(255,255,255,0.08);

            color:white;

            padding:
                16px 16px 16px 50px;

            font-size:14px;

            transition:0.3s;
        }

        input::placeholder{

            color:#94a3b8;
        }

        input:focus{

            background:
                rgba(255,255,255,0.12);

            box-shadow:
                0 0 0 4px rgba(99,102,241,0.35);
        }

        .button-group{

            display:flex;

            gap:15px;

            margin-top:30px;
        }

        button{

            border:none;

            cursor:pointer;

            border-radius:18px;

            padding:15px 20px;

            color:white;

            font-weight:600;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-3px);
        }

        .btn-save{

            flex:1;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );
        }

        .btn-reset{

            background:
                linear-gradient(
                    135deg,
                    #475569,
                    #334155
                );
        }

        /* RIGHT */

        .table-card{

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(18px);

            border-radius:30px;

            padding:35px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.35);
        }

        .table-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            gap:20px;

            flex-wrap:wrap;

            margin-bottom:30px;
        }

        .table-header h2{

            font-size:32px;

            margin-bottom:5px;
        }

        .table-header p{

            color:#94a3b8;
        }

        .search-box{

            width:320px;

            position:relative;
        }

        .search-box i{

            position:absolute;

            left:18px;

            top:50%;

            transform:translateY(-50%);

            color:#94a3b8;
        }

        .search-box input{

            padding-left:50px;
        }

        /* TABLE */

        .table-wrapper{

            overflow-x:auto;
        }

        table{

            width:100%;

            border-collapse:collapse;
        }

        thead{

            background:
                rgba(255,255,255,0.06);
        }

        th{

            padding:22px;

            text-align:left;

            font-size:14px;

            color:#cbd5e1;
        }

        td{

            padding:22px;

            border-bottom:
                1px solid rgba(255,255,255,0.06);

            color:#e2e8f0;
        }

        tbody tr{

            transition:0.3s;
        }

        tbody tr:hover{

            background:
                rgba(255,255,255,0.05);
        }

        .student-info{

            display:flex;

            align-items:center;

            gap:14px;
        }

        .student-avatar{

            width:45px;

            height:45px;

            border-radius:50%;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            display:flex;

            justify-content:center;

            align-items:center;

            font-weight:700;
        }

        .actions{

            display:flex;

            gap:12px;
        }

        .btn-edit{

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #2563eb
                );
        }

        .btn-delete{

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );
        }

        /* MESSAGE */

        .message{

            margin-bottom:20px;

            font-weight:600;
        }

        .success{
            color:#4ade80;
        }

        .error{
            color:#f87171;
        }

        /* PAGINATION */

        .pagination{

            display:flex;

            justify-content:center;

            gap:12px;

            margin-top:30px;

            flex-wrap:wrap;
        }

        .pagination button{

            width:45px;

            height:45px;

            border:none;

            border-radius:14px;

            background:
                rgba(255,255,255,0.08);

            color:white;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .pagination button:hover{

            background:
                rgba(99,102,241,0.5);
        }

        .pagination button.active{

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 0 15px rgba(99,102,241,0.5);
        }

        /* MOBILE */

        @media(max-width:1000px){

            .container{

                grid-template-columns:1fr;
            }

            .left-panel{

                position:relative;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- LEFT -->

    <div class="left-panel">

        <div class="form-card">

            <div class="avatar"
                 id="avatarLetter">

                S

            </div>

            <div class="form-header">

                <h2>Thông Tin Sinh Viên</h2>

                <p>Thêm hoặc cập nhật sinh viên</p>

            </div>

            <input type="hidden"
                   id="studentId">

            <!-- NAME -->

            <div class="input-group">

                <label>Họ Và Tên</label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                           id="name"
                           placeholder="Nhập tên sinh viên"
                           onkeyup="updateAvatar()">

                </div>

            </div>

            <!-- EMAIL -->

            <div class="input-group">

                <label>Email</label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                           id="email"
                           placeholder="Nhập email sinh viên">

                </div>

            </div>

            <!-- BUTTON -->

            <div class="button-group">

                <button class="btn-save"
                        onclick="saveStudent()">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Lưu

                </button>

                <button class="btn-reset"
                        onclick="resetForm()">

                    <i class="fa-solid fa-rotate-left"></i>
                    Làm Mới

                </button>

            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right-panel">

        <div class="table-card">

            <div class="table-header">

                <div>

                    <h2>Danh Sách Sinh Viên</h2>

                    <p>
                        Tổng:
                        <span th:text="${students.size()}">0</span>
                        sinh viên
                    </p>

                </div>

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text"
                           id="search"
                           placeholder="Tìm kiếm sinh viên..."
                           onkeyup="searchStudent()">

                </div>

            </div>

            <div id="message"
                 class="message"></div>

            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Sinh Viên</th>

                        <th>Email</th>

                        <th>Hành Động</th>

                    </tr>

                    </thead>

                    <tbody id="studentTable">

                    <tr th:each="s : ${students}">

                        <td th:text="${s.id}"></td>

                        <td>

                            <div class="student-info">

                                <div class="student-avatar"
                                     th:text="${#strings.substring(s.name,0,1)}">

                                    A

                                </div>

                                <span th:text="${s.name}"></span>

                            </div>

                        </td>

                        <td th:text="${s.email}"></td>

                        <td>

                            <div class="actions">

                                <button class="btn-edit"
                                        th:attr="onclick=|editStudent('${s.id}','${s.name}','${s.email}')|">

                                    <i class="fa-solid fa-pen"></i>

                                </button>

                                <button class="btn-delete"
                                        th:attr="onclick=|deleteStudent('${s.id}')|">

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- PAGINATION -->

            <div class="pagination"
                 id="pagination"></div>

        </div>

    </div>

</div>

<script>

    let rowsPerPage = 5

    let currentPage = 1

    const rows =
        Array.from(
            document.querySelectorAll(
                "#studentTable tr"
            )
        )

    /* MESSAGE */

    function showMessage(text,type){

        let message =
            document.getElementById("message")

        message.innerText = text

        message.className =
            "message " + type

        setTimeout(()=>{

            message.innerText = ""

        },3000)

    }

    /* AVATAR */

    function updateAvatar(){

        let name =
            document.getElementById("name")
            .value

        document.getElementById("avatarLetter")
            .innerText =
                name
                ? name.charAt(0).toUpperCase()
                : "S"

    }

    /* SAVE */

    async function saveStudent(){

        let id =
            document.getElementById("studentId")
            .value

        let name =
            document.getElementById("name")
            .value
            .trim()

        let email =
            document.getElementById("email")
            .value
            .trim()

        if(name === "" || email === ""){

            showMessage(
                "Vui lòng nhập đầy đủ thông tin",
                "error"
            )

            return
        }

        let url = "/api/students"

        let method = "POST"

        if(id){

            url += "/" + id

            method = "PUT"
        }

        try{

            let response =
                await fetch(url,{

                    method:method,

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        name:name,
                        email:email

                    })

                })

            if(!response.ok){
                throw new Error()
            }

            showMessage(

                id
                ? "Cập nhật sinh viên thành công"
                : "Thêm sinh viên thành công",

                "success"

            )

            setTimeout(()=>{

                location.reload()

            },1000)

        }catch(error){

            showMessage(
                "Lỗi máy chủ",
                "error"
            )

        }

    }

    /* EDIT */

    function editStudent(id,name,email){

        document.getElementById("studentId").value = id

        document.getElementById("name").value = name

        document.getElementById("email").value = email

        updateAvatar()

        window.scrollTo({

            top:0,
            behavior:"smooth"

        })

    }

    /* DELETE */

    async function deleteStudent(id){

        if(!confirm("Bạn có chắc muốn xóa sinh viên này?")){
            return
        }

        try{

            let response =
                await fetch("/api/students/" + id,{

                    method:"DELETE"

                })

            if(!response.ok){
                throw new Error()
            }

            showMessage(
                "Xóa sinh viên thành công",
                "success"
            )

            setTimeout(()=>{

                location.reload()

            },1000)

        }catch(error){

            showMessage(
                "Xóa thất bại",
                "error"
            )

        }

    }

    /* RESET */

    function resetForm(){

        document.getElementById("studentId").value = ""

        document.getElementById("name").value = ""

        document.getElementById("email").value = ""

        document.getElementById("avatarLetter")
            .innerText = "S"

    }

    /* SEARCH */

    function searchStudent(){

        let keyword =
            document.getElementById("search")
            .value
            .toLowerCase()

        rows.forEach(row=>{

            let name =
                row.children[1]
                .innerText
                .toLowerCase()

            row.style.display =
                name.includes(keyword)
                ? ""
                : "none"

        })

    }

    /* PAGINATION */

    function displayTable(page){

        currentPage = page

        let start =
            (page - 1) * rowsPerPage

        let end =
            start + rowsPerPage

        rows.forEach((row,index)=>{

            if(index >= start && index < end){

                row.style.display = ""

            }else{

                row.style.display = "none"

            }

        })

        updatePaginationButtons()

    }

    function setupPagination(){

        let pagination =
            document.getElementById("pagination")

        pagination.innerHTML = ""

        let pageCount =
            Math.ceil(
                rows.length / rowsPerPage
            )

        for(let i = 1; i <= pageCount; i++){

            let btn =
                document.createElement("button")

            btn.innerText = i

            btn.addEventListener("click",()=>{

                displayTable(i)

            })

            pagination.appendChild(btn)

        }

        updatePaginationButtons()

    }

    function updatePaginationButtons(){

        let buttons =
            document.querySelectorAll(
                ".pagination button"
            )

        buttons.forEach((btn,index)=>{

            btn.classList.remove("active")

            if(index + 1 === currentPage){

                btn.classList.add("active")

            }

        })

    }

    setupPagination()

    displayTable(1)

</script>

</body>

</html>
